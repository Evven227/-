server:
  address: 0.0.0.0
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: adc-dental-backend
  datasource:
    url: ${ADC_DB_URL:jdbc:postgresql://127.0.0.1:5433/adc_dental}
    username: ${ADC_DB_USER:postgres}
    password: ${ADC_DB_PASSWORD:请替换为你的数据库口令}
    hikari:
      maximum-pool-size: 10
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
